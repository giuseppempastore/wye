name: wye
description: "WYE - Product Safety and Nutrition Scoring App for Android and iOS"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.0

  # Navigation
  go_router: ^17.5.0

  # API & HTTP
  http: ^1.1.0
  dio: ^5.3.1

  # JSON & Models
  json_annotation: ^4.8.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Camera & Barcode Scanning
  mobile_scanner: ^7.4.0
  permission_handler: ^13.0.1

  # UI Components
  flutter_svg: ^2.0.7
  shimmer: ^4.0.0
  badges: ^3.1.1

  # Utils
  intl: ^0.20.3
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.0

flutter:
  uses-material-design: true
