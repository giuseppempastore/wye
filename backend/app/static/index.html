<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wye MVP Prototype</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
        margin: 0;
        padding: 32px;
        color: #1f2937;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        padding: 16px;
        border-radius: 12px;
        border: 1px solid #d1d5db;
        font-size: 16px;
        box-sizing: border-box;
      }
      button {
        margin-top: 16px;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }
      .result {
        margin-top: 28px;
        padding: 18px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
      }
      .score-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
      }
      .score-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 20px 28px;
        border-radius: 16px;
        font-size: 38px;
        font-weight: bold;
        transition: all 0.25s ease;
      }
      .danger-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #ffffff;
        color: #dc2626;
        font-weight: bold;
        font-size: 20px;
        border: 2px solid #dc2626;
      }
      .score-badge.excellent {
        animation: pulse 1.6s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 0 0 rgba(34, 197, 94, 0.4); }
        50% { transform: scale(1.02); box-shadow: 0 0 18px rgba(34, 197, 94, 0.6); }
        100% { transform: scale(1); box-shadow: 0 0 0 rgba(34, 197, 94, 0.4); }
      }
      .ingredients {
        margin-top: 20px;
      }
      .ingredient {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 10px;
        border-bottom: 1px solid #e5e7eb;
      }
      .risk {
        font-weight: bold;
      }
      .meta {
        margin: 10px 0 18px 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Wye MVP Prototype</h1>
      <p>Inserisci gli ingredienti separati da virgola oppure su più righe.</p>

      <textarea id="ingredientsInput">sodio benzoato, acqua, sciroppo di glucosio, acido citrico, olio di palma, zucchero</textarea>
      <div>
        <button id="analyzeBtn">Analizza prodotto</button>
      </div>

      <div id="result" class="result" style="display:none;"></div>
    </div>

    <script>
      const input = document.getElementById('ingredientsInput');
      const btn = document.getElementById('analyzeBtn');
      const resultBox = document.getElementById('result');

      function renderResult(data) {
        const scoreClass = data.score >= 90 ? 'excellent' : '';
        const warningIcon = data.forced_zero ? '<span class="danger-icon">⚠</span>' : '';

        resultBox.style.display = 'block';
        resultBox.innerHTML = `
          <div><strong>Prodotto:</strong> ${data.product_name}</div>
          <div class="score-row">
            ${warningIcon}
            <div class="score-badge ${scoreClass}" style="background:${data.score_color}; color:${data.score_text_color};">
              ${data.score}/100
            </div>
          </div>
          <div class="meta">
            <div><strong>Verdetto:</strong> ${data.verdict}</div>
            <div><strong>Livello:</strong> ${data.score_label}</div>
            <div><strong>Warning:</strong> ${data.warnings.length ? data.warnings.join(', ') : 'nessuno'}</div>
          </div>
          <div class="ingredients">
            ${data.ingredients.map(item => `
              <div class="ingredient">
                <span>${item.canonical}</span>
                <span class="risk">${item.risk_level}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      btn.addEventListener('click', async () => {
        const payload = {
          product_name: 'Prodotto demo',
          ingredients: input.value,
          language: 'it'
        };

        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        renderResult(data);
      });
    </script>
  </body>
</html>
